<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesla Inventory Helper</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Tesla Inventory Helper</h1>
      <p id="status" class="status">Open a Tesla inventory page to see match counts.</p>
    </header>
    <main>
      <textarea id="rules" spellcheck="false" autocomplete="off"></textarea>
      <p id="error" class="error" hidden></p>
      <div class="actions">
        <button id="save" type="button">Save</button>
        <button id="restore" type="button" class="link">Restore defaults</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
