<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesla Inventory Helper</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Tesla Inventory Helper</h1>
      <p id="status" class="status">Open a Tesla inventory or order page to see match counts.</p>
    </header>
    <main>
      <section class="highlight-toggle" aria-labelledby="highlight-toggle-title">
        <h2 id="highlight-toggle-title">Highlight Matches</h2>
        <label class="switch" for="highlighting-enabled">
          <span class="sr-only">Highlight Matches</span>
          <input id="highlighting-enabled" type="checkbox" checked />
          <span class="switch-track" aria-hidden="true"></span>
        </label>
      </section>
      <textarea id="rules" spellcheck="false" autocomplete="off"></textarea>
      <p id="error" class="error" hidden></p>
      <div class="actions">
        <button id="save" type="button">Save</button>
        <button id="restore" type="button" class="link">Restore defaults</button>
      </div>
      <section class="test">
        <label for="test-vin">Test a VIN against the rules above</label>
        <input
          id="test-vin"
          type="text"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="characters"
          maxlength="17"
          placeholder="e.g. 7SAYGDEE5PF789500"
        />
        <p id="test-result" class="test-result"></p>
      </section>
    </main>
    <footer class="footer">
      <a
        href="https://chromewebstore.google.com/detail/ehgoebfdmhafkkongmkidfacnaopncli/reviews"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon" aria-hidden="true">★</span>
        <span>Rate</span>
      </a>
      <a
        href="https://buymeacoffee.com/songsterq"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon" aria-hidden="true">☕</span>
        <span>Donate</span>
      </a>
      <a
        href="https://www.tesla.com/referral/song752203"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon" aria-hidden="true">🚗</span>
        <span>Order Tesla</span>
      </a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
